# HarithKavish Ecosystem Registry
#
# The machine-readable answer to "is this repository part of the ecosystem, and what is
# it?". Agents consult this during bootstrap discovery (see AGENT_BOOTSTRAP.md, step 3).
#
# This file records membership, role, surface, adoption state, and when each membership
# decision was last verified. It records nothing else. Rules live in the doctrine, the
# standards, and the protocols; a repository's own rules live in its AGENTS.md. Do not
# add rules here.
#
# Adding or changing an entry is a governance change (MAINTENANCE.md).

schema_version: 2
updated: 2026-09-05
last_account_reconciliation: 2026-09-05

ecosystem:
  name: HarithKavish
  owner: HarithKavish
  primary_domain: harithkavish.com
  governance:
    repository: HarithKavish/harithkavish-governance
    url: https://github.com/HarithKavish/harithkavish-governance
    doctrine: MASTER_DOCTRINE.md
    bootstrap: AGENT_BOOTSTRAP.md

# ---------------------------------------------------------------------------
# Vocabulary
# ---------------------------------------------------------------------------

roles:
  governance:      Defines how the ecosystem operates. Contains no product code.
  shared-library:  Consumed by other repositories. Authoritative for its concern.
  website:         A public surface with its own address.
  application:     An interactive product, may require authentication.
  service:         A backend or engine with no public UI of its own.
  infrastructure:  Hosting, tooling, or operational support.

adoption:
  registered:  Recognized as a member. No governance files yet.
  integrated:  AGENTS.md and GOVERNANCE.md present and pointing at governance.
  aligned:     Integrated, and no known outstanding compliance gaps.
  retired:     No longer active. Retained for history or as a pointer.
  excluded:    Not an ecosystem surface. Governance does not apply.

# The membership test is defined in AGENT_BOOTSTRAP.md, step 3. This file is one of its
# inputs, not a second copy of it.
#
# COMPLETENESS. Every repository under the HarithKavish account appears here exactly
# once: under 'repositories' if governance covers it, under 'excluded' if it does not.
# A repository in neither list is UNDECIDED, not excluded -- its membership has never
# been established, and it is resolved under protocols/REPOSITORY_ALIGNMENT.md, Phase 0.
#
# This reverses the earlier policy of not enumerating coursework and scratch
# repositories. Leaving them out made an undecided repository indistinguishable from an
# unnoticed one, which is the gap that policy created.
#
# last_checked on an entry is the date that decision was last verified.
# last_account_reconciliation above is the date the whole account was last swept for
# repositories missing from this file.

# ---------------------------------------------------------------------------
# Repositories
# ---------------------------------------------------------------------------

